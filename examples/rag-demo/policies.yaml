# Rules that apply to every contract in this repository.
apiVersion: v1
kind: PolicyPack
requireGovernance: true
forbiddenUses:
  - {classification: pii, uses: [finetune]}
  - {classification: phi, uses: [finetune, eval]}
allowedProviders:                # where personal data may be sent
  - {classification: pii, providers: [openai, anthropic, local]}
